<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strimi — Diagramas</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface-active: #222633;
      --border: #2a2e3d;
      --text: #e4e4e7;
      --text-muted: #8b8d98;
      --accent: #6c63ff;
      --accent-glow: rgba(108, 99, 255, 0.15);
      --green: #22c55e;
      --amber: #f59e0b;
      --rose: #f43f5e;
      --cyan: #06b6d4;
      --violet: #8b5cf6;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    .header {
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      white-space: nowrap;
    }

    .header .subtitle {
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    /* ── Tabs ── */
    .tabs-wrapper {
      display: flex;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      overflow-x: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .tabs-wrapper::-webkit-scrollbar { height: 4px; }
    .tabs-wrapper::-webkit-scrollbar-track { background: transparent; }
    .tabs-wrapper::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .tab-group {
      display: flex;
      padding: 0 0.5rem;
    }

    .tab-group-label {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      padding: 0.6rem 0.75rem 0.25rem;
      white-space: nowrap;
      user-select: none;
    }

    .tab-group-items {
      display: flex;
      gap: 2px;
    }

    .tab {
      padding: 0.5rem 0.85rem;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-muted);
      background: transparent;
      border: none;
      cursor: pointer;
      white-space: nowrap;
      border-radius: 6px 6px 0 0;
      transition: all 0.15s ease;
      position: relative;
    }

    .tab:hover {
      color: var(--text);
      background: var(--surface);
    }

    .tab.active {
      color: var(--accent);
      background: var(--surface-active);
    }

    .tab.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0.5rem;
      right: 0.5rem;
      height: 2px;
      background: var(--accent);
      border-radius: 1px 1px 0 0;
    }

    .tab .dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      margin-right: 0.4rem;
      vertical-align: middle;
    }

    .dot-green { background: var(--green); }
    .dot-amber { background: var(--amber); }
    .dot-rose { background: var(--rose); }
    .dot-cyan { background: var(--cyan); }
    .dot-violet { background: var(--violet); }
    .dot-accent { background: var(--accent); }

    /* ── Separator ── */
    .tab-sep {
      width: 1px;
      background: var(--border);
      margin: 0.5rem 0.25rem;
      flex-shrink: 0;
    }

    /* ── Content ── */
    .content {
      flex: 1;
      position: relative;
      background: var(--bg);
    }

    .frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: none;
    }

    .frame.active {
      display: block;
    }

    /* ── Loading ── */
    .loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      gap: 0.5rem;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="header">
    <h1>Strimi</h1>
    <span class="subtitle">Arquitectura y flujos de negocio</span>
  </div>

  <div class="tabs-wrapper">
    <!-- ARCHITECTURE -->
    <div class="tab-group">
      <div>
        <div class="tab-group-label">Arquitectura</div>
        <div class="tab-group-items">
          <button class="tab active" data-target="f-arch"><span class="dot dot-cyan"></span>System</button>
        </div>
      </div>
    </div>

    <div class="tab-sep"></div>

    <!-- AUTH -->
    <div class="tab-group">
      <div>
        <div class="tab-group-label">Auth</div>
        <div class="tab-group-items">
          <button class="tab" data-target="f-register"><span class="dot dot-accent"></span>Register</button>
          <button class="tab" data-target="f-login"><span class="dot dot-accent"></span>Login</button>
          <button class="tab" data-target="f-otp"><span class="dot dot-accent"></span>OTP</button>
          <button class="tab" data-target="f-recover"><span class="dot dot-accent"></span>Recover</button>
        </div>
      </div>
    </div>

    <div class="tab-sep"></div>

    <!-- SUBSCRIPTION -->
    <div class="tab-group">
      <div>
        <div class="tab-group-label">Suscripción</div>
        <div class="tab-group-items">
          <button class="tab" data-target="f-subscribe"><span class="dot dot-green"></span>Subscribe</button>
          <button class="tab" data-target="f-cancel"><span class="dot dot-rose"></span>Cancel</button>
          <button class="tab" data-target="f-webhook"><span class="dot dot-amber"></span>Webhook</button>
        </div>
      </div>
    </div>

    <div class="tab-sep"></div>

    <!-- VIDEO -->
    <div class="tab-group">
      <div>
        <div class="tab-group-label">Video</div>
        <div class="tab-group-items">
          <button class="tab" data-target="f-video"><span class="dot dot-amber"></span>Processing</button>
        </div>
      </div>
    </div>

    <div class="tab-sep"></div>

    <!-- NEWSLETTER -->
    <div class="tab-group">
      <div>
        <div class="tab-group-label">Newsletter</div>
        <div class="tab-group-items">
          <button class="tab" data-target="f-newsletter"><span class="dot dot-violet"></span>Send</button>
        </div>
      </div>
    </div>

    <div class="tab-sep"></div>

    <!-- CONTENT -->
    <div class="tab-group">
      <div>
        <div class="tab-group-label">Contenido</div>
        <div class="tab-group-items">
          <button class="tab" data-target="f-content"><span class="dot dot-cyan"></span>Browse</button>
        </div>
      </div>
    </div>
  </div>

  <div class="content">
    <div class="loading" id="loading"><div class="spinner"></div> Cargando...</div>

    <iframe class="frame active" id="f-arch" src="strimi-architecture.html" onload="onLoad(this)"></iframe>
    <iframe class="frame" id="f-register" src="workflow-auth-register.html" onload="onLoad(this)"></iframe>
    <iframe class="frame" id="f-login" src="workflow-auth-login.html" onload="onLoad(this)"></iframe>
    <iframe class="frame" id="f-otp" src="workflow-auth-otp.html" onload="onLoad(this)"></iframe>
    <iframe class="frame" id="f-recover" src="workflow-auth-recover.html" onload="onLoad(this)"></iframe>
    <iframe class="frame" id="f-subscribe" src="workflow-subscribe.html" onload="onLoad(this)"></iframe>
    <iframe class="frame" id="f-cancel" src="workflow-subscription-cancel.html" onload="onLoad(this)"></iframe>
    <iframe class="frame" id="f-webhook" src="workflow-subscription-webhook.html" onload="onLoad(this)"></iframe>
    <iframe class="frame" id="f-video" src="workflow-video.html" onload="onLoad(this)"></iframe>
    <iframe class="frame" id="f-newsletter" src="workflow-newsletter.html" onload="onLoad(this)"></iframe>
    <iframe class="frame" id="f-content" src="workflow-content.html" onload="onLoad(this)"></iframe>
  </div>

  <script>
    // Tab switching
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        // Deactivate all
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.frame').forEach(f => f.classList.remove('active'));

        // Activate selected
        tab.classList.add('active');
        const frame = document.getElementById(tab.dataset.target);
        frame.classList.add('active');
      });
    });

    // Hide loading on first iframe load
    function onLoad(iframe) {
      const loading = document.getElementById('loading');
      if (loading) loading.remove();
    }

    // Keyboard navigation (left/right arrows)
    document.addEventListener('keydown', (e) => {
      const tabs = [...document.querySelectorAll('.tab')];
      const activeIdx = tabs.findIndex(t => t.classList.contains('active'));
      if (e.key === 'ArrowRight' && activeIdx < tabs.length - 1) {
        tabs[activeIdx + 1].click();
      } else if (e.key === 'ArrowLeft' && activeIdx > 0) {
        tabs[activeIdx - 1].click();
      }
    });
  </script>

</body>
</html>
